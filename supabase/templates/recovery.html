<!--
  Together — "Reset password" email template.

  This is NOT applied automatically — see supabase/templates/invite.html for
  why, and for the full reasoning behind linking to /auth/callback with
  token_hash + type instead of the default {{ .ConfirmationURL }}.

  To apply it: Supabase Dashboard → Authentication → Email Templates →
  Reset password → paste this file's <body> content into the template
  editor → Save.

  Unlike the invite template, this one needed only for consistency — a
  password-reset request is made and clicked by the same person in the same
  browser, so the *default* {{ .ConfirmationURL }} would actually still work
  here (lib/actions/auth.ts's requestPasswordReset sets up a PKCE
  code_verifier cookie that survives to the click). This template is used
  anyway so /auth/callback has exactly one verification path — token_hash +
  verifyOtp — for every emailed link in the app, invite or recovery, rather
  than two different mechanisms living behind one route.

  Variables used:
  - {{ .TokenHash }} — the hashed one-time token; verified server-side.
  - {{ .SiteURL }}   — this app's own URL, configured in the project's
    Auth settings.

  No `next` parameter: /auth/callback falls through to /reset-password
  whenever `next` is absent, which is exactly where a recovery link should
  land.
-->
<div style="background-color:#f6f7f5;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;border-collapse:collapse;">
    <tr>
      <td style="background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:32px;">
        <p style="margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#0e6b57;">
          Together
        </p>
        <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;color:#12181a;">
          Reset your password
        </h1>
        <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#59645e;">
          We received a request to reset your password. Follow the link
          below to choose a new one.
        </p>
        <a
          href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery"
          style="display:inline-block;background-color:#0e6b57;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:10px 20px;border-radius:8px;"
        >
          Reset password
        </a>
        <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#8a968f;">
          If you didn't request this, you can safely ignore this email.
        </p>
      </td>
    </tr>
  </table>
</div>
